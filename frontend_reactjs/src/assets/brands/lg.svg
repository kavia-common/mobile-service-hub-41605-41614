<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="LG logo">
  <rect width="128" height="128" rx="28" fill="rgba(37,99,235,0.10)"/>
  <!-- LG: magenta/red circle with white face/letters (simplified, grid-friendly) -->
  <circle cx="64" cy="64" r="40" fill="#A50034"/>
  <!-- eye -->
  <circle cx="78" cy="52" r="5.5" fill="#fff"/>
  <!-- "L" -->
  <path d="M52 44v44h18" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "G" (stylized inner stroke) -->
  <path d="M84 64h-12v16" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="114" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">LG</text>
</svg>
